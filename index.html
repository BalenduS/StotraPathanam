<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn Sri Rudram, Guru Ashtakam, Aditya Hrudayam, Karthikeya Bhujangam, Shiva Stuti and Subrahmanya Ashtakam verse by verse in Devanagari and Telugu, with meanings.">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Stotra Pathashala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Tiro+Telugu&family=Mukta:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: a single reading column, like a pothi page — chant text large and centred on its own ground, meaning set below in a quieter serif. */
:root{
  --ground:#F3F1EE;        /* vibhuti ash */
  --leaf:#FBFAF8;          /* reading surface */
  --ink:#1E1B26;           /* lamp-black ink */
  --muted:#6B6573;
  --rule:#DEDAD5;
  --kumkum:#A8231A;        /* accent: kumkum red */
  --kumkum-soft:#F4E2DF;
  --haldi:#B87A00;         /* turmeric, for "learning" state */
  --haldi-soft:#F6EBD3;
  --done:#2F6B45;          /* memorised */
  --done-soft:#E0EDE4;
  --f-dev:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Kohinoor Devanagari",serif;
  --f-tel:"Tiro Telugu","Noto Serif Telugu","Kohinoor Telugu",serif;
  --f-ui:"Mukta","Segoe UI",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --chant:1.38rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#16141C;--leaf:#1F1C26;--ink:#ECE7E1;--muted:#A49EAD;--rule:#34303D;
  --kumkum:#F08A70;--kumkum-soft:#3A2324;--haldi:#E2B14A;--haldi-soft:#36301F;--done:#7FC79A;--done-soft:#1E3326;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#16141C;--leaf:#1F1C26;--ink:#ECE7E1;--muted:#A49EAD;--rule:#34303D;
  --kumkum:#F08A70;--kumkum-soft:#3A2324;--haldi:#E2B14A;--haldi-soft:#36301F;--done:#7FC79A;--done-soft:#1E3326;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--kumkum);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);display:flex;align-items:center;gap:8px;padding-block:8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--rule)}
.bar .back{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--kumkum);min-height:40px;padding-right:8px}
.bar .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--leaf);border:1px solid var(--rule);border-radius:999px;padding:2px}
.seg button{padding:5px 11px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--leaf)}
.seg .d{font-family:var(--f-dev);font-weight:400;font-size:1rem}
.seg .te{font-family:var(--f-tel);font-weight:400;font-size:1rem}

/* home */
.masthead{padding-block:20px 8px;display:grid;gap:6px}
.masthead h1{font-family:var(--f-dev);font-weight:400;font-size:2.2rem;line-height:1.1}
.masthead p{margin:0;color:var(--muted);max-width:52ch}
.tripundra{display:grid;gap:4px;width:56px;margin-bottom:6px}
.tripundra i{display:block;height:3px;border-radius:2px;background:var(--muted);opacity:.55}
.tripundra i:nth-child(2){position:relative}
.tripundra i:nth-child(2)::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--kumkum);transform:translate(-50%,-50%)}
.resume{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--kumkum-soft);border-radius:12px;text-align:left;width:100%}
.resume b{display:block}
.resume span{font-size:.88rem;color:var(--muted)}
.resume .go{margin-left:auto;font-weight:700;color:var(--kumkum);white-space:nowrap}
.list{display:grid;gap:12px;margin-top:18px}
.stotra{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;text-align:left;width:100%;background:var(--leaf);border:1px solid var(--rule);border-radius:14px;padding:16px}
.stotra .nm{font-size:1.15rem;font-weight:700}
.stotra .sc{font-size:1.25rem;line-height:1.3}
.stotra .meta{font-size:.86rem;color:var(--muted);grid-column:1/-1}
.ring{grid-row:1/3;grid-column:2;width:54px;height:54px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.bars{grid-column:1/-1;display:flex;gap:2px;margin-top:6px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.bars i.l{background:var(--haldi)} .bars i.m{background:var(--done)}
.foot{margin-top:28px;font-size:.84rem;color:var(--muted);display:grid;gap:6px}
.foot a{color:var(--kumkum)}

/* stotra page */
.head{padding-block:14px 6px;display:grid;gap:6px}
.head .sc{font-size:2rem;line-height:1.2}
.head h2{font-size:1.05rem;font-weight:600;color:var(--muted)}
.intro{font-family:var(--f-read);font-size:1.02rem;line-height:1.6;max-width:62ch;margin:6px 0 0}
.refrain{margin-top:10px;padding:12px 14px;border-left:3px solid var(--kumkum);background:var(--leaf);border-radius:0 10px 10px 0;font-family:var(--f-read);font-size:.98rem}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--leaf);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.chip.l .dot{background:var(--haldi)} .chip.m .dot{background:var(--done)}
.group{margin-top:22px}
.group h3{font-size:.95rem;font-weight:700;display:flex;justify-content:space-between;gap:12px}
.group h3 small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.group .theme{font-family:var(--f-read);font-size:.92rem;color:var(--muted);margin:4px 0 0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:10px}
.u{height:44px;border-radius:10px;background:var(--leaf);border:1px solid var(--rule);font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums}
.u.l{background:var(--haldi-soft);border-color:var(--haldi);color:var(--ink)}
.u.m{background:var(--done-soft);border-color:var(--done)}
.startrow{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--ink);color:var(--leaf)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}

/* verse reader */
.reader{margin-top:8px}
.pos{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:6px}
.pos .g{font-size:.84rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--kumkum);transition:width .25s}
.leaf{margin-top:12px;background:var(--leaf);border:1px solid var(--rule);border-radius:16px;padding:22px 18px;position:relative}
.leaf::before,.leaf::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;border:1px solid var(--rule);background:var(--ground);transform:translateY(-50%)}
.leaf::before{left:8px}.leaf::after{right:8px}
.chant{display:grid;gap:14px;text-align:center}
.blk{display:grid;gap:4px}
.blk + .blk{padding-top:12px;border-top:1px dashed var(--rule)}
.line{font-size:var(--chant);line-height:1.65;overflow-wrap:anywhere;border-radius:8px;transition:filter .2s, background .2s}
.line.dev{font-family:var(--f-dev)}
.line.tel{font-family:var(--f-tel)}
.both .blk.tel .line{font-size:calc(var(--chant)*.92);color:var(--muted)}
.hidden .line{filter:blur(7px);background:var(--ground);cursor:pointer;user-select:none}
.hidden .line.shown{filter:none;background:transparent}
.hidden .line.first{filter:none;background:transparent}
.hint{font-size:.82rem;color:var(--muted);text-align:center;margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.tool{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--leaf);font-weight:600;font-size:.88rem}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--leaf)}
.meaning{margin-top:16px;display:grid;gap:12px}
.meaning p{margin:0;font-family:var(--f-read);font-size:1.06rem;line-height:1.62;max-width:62ch}
.gloss{display:grid;gap:0;border-top:1px solid var(--rule)}
.gloss div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.gloss .w{font-size:1.1rem;line-height:1.4;overflow-wrap:anywhere}
.gloss .w.dev{font-family:var(--f-dev)} .gloss .w.tel{font-family:var(--f-tel)}
.gloss .gm{font-family:var(--f-read);font-size:.95rem;color:var(--muted)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.status button{min-height:46px;border-radius:12px;border:1px solid var(--rule);background:var(--leaf);font-weight:700}
.status .l[aria-pressed="true"]{background:var(--haldi-soft);border-color:var(--haldi)}
.status .m[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ground);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav button{min-height:48px;border-radius:12px;font-weight:700;border:1px solid var(--rule);background:var(--leaf)}
.nav .next{background:var(--kumkum);color:#fff;border-color:var(--kumkum)}
:root[data-theme="dark"] .nav .next{color:#1A0E0C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .next{color:#1A0E0C}}
.nav button:disabled{opacity:.4}
.size{display:inline-flex;gap:4px}
.size button{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--leaf);font-weight:700}
.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" hidden><div class="in"><button id="prev" type="button">← Previous</button><button id="next" class="next" type="button">Next →</button></div></nav>

<script id="data" type="application/json">[{"id":"rudram","name":"Sri Rudram","dev":"श्रीरुद्रम्","tel":"శ్రీరుద్రమ్","by":"Krishna Yajur Veda, Taittiriya Samhita","intro":"Sri Rudram is from the Krishna Yajur Veda (Taittiriya Samhita 4.5 and 4.7). The Namakam, named for its repeated 'namo', has 11 anuvakas (sections) that salute Rudra in every form — fierce and gentle, in all places, people and things — and ask him to turn his weapons away. The Chamakam, named for its repeated 'cha me' ('and to me'), has 11 anuvakas asking for everything a full life needs. It is traditionally learned by ear from a teacher, with svaras (Vedic accents); use this text to understand and memorise, and learn the chanting from a guru or a trusted recording.","groups":[{"name":"Namakam · Anuvaka 1","theme":"Pacifying Rudra: salutations to his anger, bow and arrows, and a prayer that his weapons become gentle and are turned away.","units":[{"label":"1.1","dev":["नमस्ते रुद्रमन्यव उतोत इषवे नमः ।","नमस्ते अस्तु धन्वने बाहुभ्यामुत ते नमः ॥"],"tel":["నమస్తే రుద్రమన్యవ ఉతోత ఇషవే నమః ।","నమస్తే అస్తు ధన్వనే బాహుభ్యాముత తే నమః ॥"],"m":"Salutations to your anger, O Rudra, and to your arrow. Salutations to your bow and to both your arms."},{"label":"1.2","dev":["यात इषुः शिवतमा शिवं बभूव ते धनुः ।","शिवा शरव्या या तव तया नो रुद्र मृडय ॥"],"tel":["యాత ఇషుః శివతమా శివం బభూవ తే ధనుః ।","శివా శరవ్యా యా తవ తయా నో రుద్ర మృడయ ॥"],"m":"Your arrow that is most auspicious, your bow that has become auspicious, and your quiver that is auspicious — with these, O Rudra, make us happy."},{"label":"1.3","dev":["या ते रुद्र शिवा तनूरघोराऽपापकाशिनी ।","तया नस्तनुवा शन्तमया गिरिशन्ताभिचाकशीहि ॥"],"tel":["యా తే రుద్ర శివా తనూరఘోరాఽపాపకాశినీ ।","తయా నస్తనువా శన్తమయా గిరిశన్తాభిచాకశీహి ॥"],"m":"O Rudra, dweller on the mountain who brings peace, look upon us with your most blissful form, which is auspicious, not fearsome, and reveals only good."},{"label":"1.4","dev":["यामिषुं गिरिशन्त हस्ते बिभर्ष्यस्तवे ।","शिवां गिरित्र तां कुरु मा हिग्ंसीः पुरुषं जगत् ॥"],"tel":["యామిషుం గిరిశన్త హస్తే బిభర్ష్యస్తవే ।","శివాం గిరిత్ర తాం కురు మా హిగ్ంసీః పురుషం జగత్ ॥"],"m":"O dweller on the mountain, make gentle the arrow you hold in your hand to shoot. O protector of the mountain, do not harm humans or the world."},{"label":"1.5","dev":["शिवेन वचसा त्वा गिरिशाच्छा वदामसि ।","यथा नः सर्वमिज्जगदयक्ष्मसुमना असत् ॥"],"tel":["శివేన వచసా త్వా గిరిశాచ్ఛా వదామసి ।","యథా నః సర్వమిజ్జగదయక్ష్మసుమనా అసత్ ॥"],"m":"O dweller on the mountain, we praise you with auspicious words, so that our whole world may be free of disease and of good mind."},{"label":"1.6","dev":["अध्यवोचदधि वक्ता प्रथमो दैव्यो भिषक् ।","अहीश्च सर्वांअम्भयन्त्सर्वाश्च यातुधान्यः ॥"],"tel":["అధ్యవోచదధి వక్తా ప్రథమో దైవ్యో భిషక్ ।","అహీశ్చ సర్వాంఅమ్భయన్త్సర్వాశ్చ యాతుధాన్యః ॥"],"m":"May he, the first divine physician, speak on our behalf. Crushing all serpents, may he drive away all evil spirits."},{"label":"1.7","dev":["असौ यस्ताम्रो अरुण उत बभ्रुः सुमंगलः ।","ये चेमाग्ं रुद्रा अभितो दिक्षु ।","श्रिताः सहस्रशोऽवैषाहेड ईमहे ॥"],"tel":["అసౌ యస్తామ్రో అరుణ ఉత బభ్రుః సుమంగలః ।","యే చేమాగ్ం రుద్రా అభితో దిక్షు ।","శ్రితాః సహస్రశోఽవైషాహేడ ఈమహే ॥"],"m":"He who is copper-coloured, ruddy, brown and most auspicious — and the thousands of Rudras who surround him in all directions — we seek to turn away their anger."},{"label":"1.8","dev":["असौ योऽवसर्पति नीलग्रीवो विलोहितः ।","उतैनं गोपा अदृशन्नदृशन्नुदहार्यः ।","उतैनं विश्वा भूतानि स दृष्टो मृडयाति नः ॥"],"tel":["అసౌ యోఽవసర్పతి నీలగ్రీవో విలోహితః ।","ఉతైనం గోపా అదృశన్నదృశన్నుదహార్యః ।","ఉతైనం విశ్వా భూతాని స దృష్టో మృడయాతి నః ॥"],"m":"He who moves along, blue-throated and red — the cowherds have seen him, the water-carrying women have seen him, all beings have seen him. May he, being seen, make us happy."},{"label":"1.9","dev":["नमो अस्तु नीलग्रीवाय सहस्राक्षाय मीढुषे ।","अथो ये अस्य सत्वानोऽहं तेभ्योऽकरन्नमः ॥"],"tel":["నమో అస్తు నీలగ్రీవాయ సహస్రాక్షాయ మీఢుషే ।","అథో యే అస్య సత్వానోఽహం తేభ్యోఽకరన్నమః ॥"],"m":"Salutations to the blue-throated, thousand-eyed giver of bounty. To his attendants too I offer my salutations."},{"label":"1.10","dev":["प्रमुंच धन्वनस्त्वमुभयोरार्त्नियोर्ज्याम् ।","याश्च ते हस्त इषवः परा ता भगवो वप ॥"],"tel":["ప్రముంచ ధన్వనస్త్వముభయోరార్త్నియోర్జ్యామ్ ।","యాశ్చ తే హస్త ఇషవః పరా తా భగవో వప ॥"],"m":"O Lord, loosen the string from both ends of your bow, and lay aside the arrows that are in your hand."},{"label":"1.11","dev":["अवतत्य धनुस्त्वग्ं सहस्राक्ष शतेषुधे ।","निशीर्य शल्यानां मुखा शिवो नः सुमना भव ॥"],"tel":["అవతత్య ధనుస్త్వగ్ం సహస్రాక్ష శతేషుధే ।","నిశీర్య శల్యానాం ముఖా శివో నః సుమనా భవ ॥"],"m":"O thousand-eyed one with a hundred quivers, unstringing your bow and blunting the tips of your arrows, become gracious and kindly towards us."},{"label":"1.12","dev":["विज्यं धनुः कपर्दिनो विशल्यो बाणवा उत ।","अनेशन्नस्येषव आभुरस्य निषंगथिः ॥"],"tel":["విజ్యం ధనుః కపర్దినో విశల్యో బాణవా ఉత ।","అనేశన్నస్యేషవ ఆభురస్య నిషంగథిః ॥"],"m":"May the bow of the one with matted hair be unstrung, his quiver empty of arrows, his arrows powerless, and his sheath empty."},{"label":"1.13","dev":["या ते हेतिर्मीढुष्टम हस्ते बभूव ते धनुः ।","तयाऽस्मान्विश्वतस्त्वमयक्ष्मया परिभुज ॥"],"tel":["యా తే హేతిర్మీఢుష్టమ హస్తే బభూవ తే ధనుః ।","తయాఽస్మాన్విశ్వతస్త్వమయక్ష్మయా పరిభుజ ॥"],"m":"O most bountiful one, with the weapon in your hand and your bow, protect us on all sides, free from disease."},{"label":"1.14","dev":["नमस्ते अस्त्वायुधायानातताय धृष्णवे ।","उभाभ्यामुत ते नमो बाहुभ्यां तव धन्वने ॥"],"tel":["నమస్తే అస్త్వాయుధాయానాతతాయ ధృష్ణవే ।","ఉభాభ్యాముత తే నమో బాహుభ్యాం తవ ధన్వనే ॥"],"m":"Salutations to your weapon, not yet drawn but powerful. Salutations to both your arms and to your bow."},{"label":"1.15","dev":["परि ते धन्वनो हेतिरस्मान्वृणक्तु विश्वतः ।","अथो य इषुधिस्तवारे अस्मन्निधेहि तम् ॥"],"tel":["పరి తే ధన్వనో హేతిరస్మాన్వృణక్తు విశ్వతః ।","అథో య ఇషుధిస్తవారే అస్మన్నిధేహి తమ్ ॥"],"m":"May your weapon pass us by on every side, and may your quiver be kept far away from us."},{"label":"1.16","dev":["नमस्ते अस्तु भगवन् विश्वेश्वराय महादेवाय त्र्यम्बकाय","त्रिपुरान्तकाय त्रिकाग्निकालाय कालाग्निरुद्राय","नीलकण्ठाय मृत्युंअयाय सर्वेश्वराय","सदाशिवाय श्रीमन्महादेवाय नमः ॥"],"tel":["నమస్తే అస్తు భగవన్ విశ్వేశ్వరాయ మహాదేవాయ త్ర్యమ్బకాయ","త్రిపురాన్తకాయ త్రికాగ్నికాలాయ కాలాగ్నిరుద్రాయ","నీలకణ్ఠాయ మృత్యుంఅయాయ సర్వేశ్వరాయ","సదాశివాయ శ్రీమన్మహాదేవాయ నమః ॥"],"m":"Salutations to you, O Lord: lord of the universe, the great god, three-eyed, destroyer of the three cities, the fire of the three fires, the fire of dissolution, blue-throated, conqueror of death, lord of all, ever-auspicious, the glorious great god — salutations."}]},{"name":"Namakam · Anuvaka 2","theme":"Rudra as lord of all: of the directions, trees, animals, paths, fields, forests, food and the healthy.","units":[{"label":"2.1","dev":["नमो हिरण्यबाहवे सेनान्ये दिशां च पतये नमो नमो","वृक्षेभ्यो हरिकेशेभ्यः पशूनां पतये नमो नमः","सस्पिञ्चराय त्विषीमते पथीनां पतये नमो नमो","बभ्लुशाय विव्याधिनेऽन्नानां पतये नमो नमो","हरिकेशायोपवीतिने पुष्टानां पतये नमो नमो","भवस्य हेत्यै जगतां पतये नमो नमो","रुद्रायातताविने क्षेत्राणां पतये नमो नमः","सूतायाहन्त्याय वनानां पतये नमो नमः ॥"],"tel":["నమో హిరణ్యబాహవే సేనాన్యే దిశాం చ పతయే నమో నమో","వృక్షేభ్యో హరికేశేభ్యః పశూనాం పతయే నమో నమః","సస్పిఞ్చరాయ త్విషీమతే పథీనాం పతయే నమో నమో","బభ్లుశాయ వివ్యాధినేఽన్నానాం పతయే నమో నమో","హరికేశాయోపవీతినే పుష్టానాం పతయే నమో నమో","భవస్య హేత్యై జగతాం పతయే నమో నమో","రుద్రాయాతతావినే క్షేత్రాణాం పతయే నమో నమః","సూతాయాహన్త్యాయ వనానాం పతయే నమో నమః ॥"],"m":"Salutations to the golden-armed commander and lord of the directions; to the trees with green leaves and the lord of animals; to the radiant, tawny one and lord of paths; to the brown-hued piercer and lord of food; to the green-haired one wearing the sacred thread and lord of the well-nourished; to the weapon of Bhava and lord of the worlds; to Rudra with drawn bow and lord of fields; to the charioteer who cannot be harmed and lord of forests."},{"label":"2.2","dev":["रोहिताय स्थपतये वृक्षाणां पतये नमो नमो","मन्त्रिणे वाणिजाय कक्षाणां पतये नमो नमो","भुवंतये वारिवस्कृतायौषधीनां पतये नमो नम","उच्चैर्घोषायाक्रन्दयते पत्तीनां पतये नमो नमः","कृत्स्नवीताय धावते सत्वनां पतये नमः ॥"],"tel":["రోహితాయ స్థపతయే వృక్షాణాం పతయే నమో నమో","మన్త్రిణే వాణిజాయ కక్షాణాం పతయే నమో నమో","భువంతయే వారివస్కృతాయౌషధీనాం పతయే నమో నమ","ఉచ్చైర్ఘోషాయాక్రన్దయతే పత్తీనాం పతయే నమో నమః","కృత్స్నవీతాయ ధావతే సత్వనాం పతయే నమః ॥"],"m":"Salutations to the red one, the master builder and lord of trees; to the counsellor and trader, lord of thickets; to the creator of the world who is generous to devotees, lord of herbs; to the one with the loud war-cry who makes enemies weep, lord of foot-soldiers; to the one fully armoured and running, lord of the brave."}]},{"name":"Namakam · Anuvaka 3","theme":"Rudra in all people, even thieves and robbers: lord of stealers, cheats, night-prowlers and those who carry weapons.","units":[{"label":"3.1","dev":["नमः सहमानाय निव्याधिन आव्याधिनीनां","पतये नमो नमः","ककुभाय निषङ्गिणे स्तेनानां पतये नमो नमो","निषङ्गिण इषुधिमते तस्कराणां पतये नमो नमो","वञ्चते परिवञ्चते स्तायूनां पतये नमो नमो","निचेरवे परिचरायारण्यानां पतये नमो नमः","सृकाविभ्यो जिघासद्भ्यो मुष्णतां पतये नमो नमो","ऽसिमद्भ्यो नक्तं चरद्भ्यः प्रकृन्तानां पतये नमो नम","उष्णीषिणे गिरिचराय कुलुञ्चानां पतये नमो नमः ॥"],"tel":["నమః సహమానాయ నివ్యాధిన ఆవ్యాధినీనాం","పతయే నమో నమః","కకుభాయ నిషఙ్గిణే స్తేనానాం పతయే నమో నమో","నిషఙ్గిణ ఇషుధిమతే తస్కరాణాం పతయే నమో నమో","వఞ్చతే పరివఞ్చతే స్తాయూనాం పతయే నమో నమో","నిచేరవే పరిచరాయారణ్యానాం పతయే నమో నమః","సృకావిభ్యో జిఘాసద్భ్యో ముష్ణతాం పతయే నమో నమో","ఽసిమద్భ్యో నక్తం చరద్భ్యః ప్రకృన్తానాం పతయే నమో నమ","ఉష్ణీషిణే గిరిచరాయ కులుఞ్చానాం పతయే నమో నమః ॥"],"m":"Salutations to the one who overpowers and pierces, lord of the attacking armies; to the excellent one with a sword, lord of thieves; to the one with sword and quiver, lord of robbers; to the cheat and the great deceiver, lord of pilferers; to the one who moves about stealthily, lord of ే చ నమో హ్రస్వాయ చ వామనాయ చ","నమో బృహతే చ వర్షీయసే చ","నమో వృద్ధాయ చ సంవృద్ధ్వనే చ ॥"],"m":"Salutations to Bhava (source of creation) and Rudra; to Sharva (destroyer) and Pashupati (lord of beings); to the blue-throated one with white throat; to the one with matted locks and the one with shaven head; to the thousand-eyed one with a hundred bows; to the mountain-dweller who pervades all beings; to the most generous one who bears arrows; to the short and the dwarf; to the vast and the very old; to the aged and the one who grows with praise."},{"label":"5.2","dev":["नमो अग्रियाय च प्रथमाय च नम आशवे चाजिराय च","नमः शीघ्रियाय च शीभ्याय च","नम ऊर्म्याय चावस्वन्याय च","नमः स्रोतस्याय च द्वीप्याय च ॥"],"tel":["నమో అగ్రియాయ చ ప్రథమాయ చ నమ ఆశవే చాజిరాయ చ","నమః శీఘ్రియాయ చ శీభ్యాయ చ","నమ ఊర్మ్యాయ చావస్వన్యాయ చ","నమః స్రోతస్యాయ చ ద్వీప్యాయ చ ॥"],"m":"Salutations to the foremost and the first; to the swift and the moving; to the quick and the one in rushing waters; to the one in waves and in still waters; to the one in streams and in islands."}]},{"name":"Namakam · Anuvaka 6","theme":"Rudra in all ages and stages: eldest and youngest, born earlier and later, in fields, forests, echoes, and as the warrior.","units":[{"label":"6.1","dev":["नमो ज्येष्ठाय च कनिष्ठाय च","नमः पूर्वजाय चापरजाय च","नमो मध्यमाय चापगल्भाय च","नमो जघन्याय च बुध्नियाय च","नमः सोभ्याय च प्रतिसर्याय च","नमो याम्याय च क्षेम्याय च","नम उर्वर्याय च खल्याय च","नमः श्लोक्याय चावसान्याय च","नमो वन्याय च कक्ष्याय च","नमः श्रवाय च प्रतिश्रवाय च ॥"],"tel":["నమో జ్యేష్ఠాయ చ కనిష్ఠాయ చ","నమః పూర్వజాయ చాపరజాయ చ","నమో మధ్యమాయ చాపగల్భాయ చ","నమో జఘన్యాయ చ బుధ్నియాయ చ","నమః సోభ్యాయ చ ప్రతిసర్యాయ చ","నమో యామ్యాయ చ క్షేమ్యాయ చ","నమ ఉర్వర్యాయ చ ఖల్యాయ చ","నమః శ్లోక్యాయ చావసాన్యాయ చ","నమో వన్యాయ చ కక్ష్యాయ చ","నమః శ్రవాయ చ ప్రతిశ్రవాయ చ ॥"],"m":"Salutations to the eldest and the youngest; to the first-born and the later-born; to the middle one and the immature; to the last-born and the one at the root; to the one between worlds and the one in charms; to the one in death and in welfare; to the one in fields and threshing floors; to the one in Vedic verses and in the end of the Vedas; to the one in forests and thickets; to sound and its echo."},{"label":"6.2","dev":["नम आशुषेणाय चाशुरथाय च","नमः शूराय चावभिन्दते च","नमो वर्मिणे च वरूथिने च","नमो बिल्मिने च कवचिने च","नमः श्रुताय च श्रुतसेनाय च ॥"],"tel":["నమ ఆశుషేణాయ చాశురథాయ చ","నమః శూరాయ చావభిన్దతే చ","నమో వర్మిణే చ వరూథినే చ","నమో బిల్మినే చ కవచినే చ","నమః శ్రుతాయ చ శ్రుతసేనాయ చ ॥"],"m":"Salutations to the one with swift armies and swift chariots; to the hero who breaks the enemy; to the one with armour and a protective shell; to the one with helmet and breastplate; to the renowned one with a renowned army."}]},{"name":"Namakam · Anuvaka 7","theme":"Rudra in sounds, weapons and all waters: drums, messengers, streams, wells, rain, clouds and lightning.","units":[{"label":"7.1","dev":["नमो दुन्दुभ्याय चाहनन्याय च नमो धृष्णवे च प्रमृशाय च","नमो दूताय च प्रहिताय च नमो निषङ्गिणे चेषुधिमते च","नमस्तीक्ष्णेषवे चायुधिने च नमः स्वायुधाय च सुधन्वने च","नमः स्रुत्याय च पथ्याय च नमः काट्याय च नीप्याय च","नमः सूद्याय च सरस्याय च नमो नाद्याय च वैशन्ताय च ॥"],"tel":["నమో దున్దుభ్యాయ చాహనన్యాయ చ నమో ధృష్ణవే చ ప్రమృశాయ చ","నమో దూతాయ చ ప్రహితాయ చ నమో నిషఙ్గిణే చేషుధిమతే చ","నమస్తీక్ష్ణేషవే చాయుధినే చ నమః స్వాయుధాయ చ సుధన్వనే చ","నమః స్రుత్యాయ చ పథ్యాయ చ నమః కాట్యాయ చ నీప్యాయ చ","నమః సూద్యాయ చ సరస్యాయ చ నమో నాద్యాయ చ వైశన్తాయ చ ॥"],"m":"Salutations to the one in drums and in drumsticks; to the bold and the reflective; to the messenger and the one sent; to the one with sword and quiver; to the one with sharp arrows and weapons; to the one with good weapons and a fine bow; to the one in roads and paths; to the one in rough ground and waterfalls; to the one in marshes and lakes; to the one in rivers and ponds."},{"label":"7.2","dev":["नमः कूप्याय चावट्याय च नमो वर्ष्याय चावर्ष्याय च","नमो मेघ्याय च विद्युत्याय च नम ईघ्रियाय चातप्याय च","नमो वात्याय च रेष्मियाय ాహ్యాయ చ ॥"],"m":"Salutations to the one in holy places and on river banks; to the one on the far shore and the near shore; to the one who carries us across and lifts us out; to the one at the crossing and the one in this world; to the one in the young grass and in the foam; to the one in the sand and in the current."}]},{"name":"Namakam · Anuvaka 9","theme":"Rudra in every place: barren land, paths, homes, beds, caves, dust, dry and green things, and in the hearts of the gods.","units":[{"label":"9.1","dev":["नम इरिण्याय च प्रपथ्याय च","नमः किशिलाय च क्षयणाय च","नमः कपर्दिने च पुलस्तये च","नमो गोष्ठ्याय च गृह्याय च","नमस्तल्प्याय च गेह्याय च","नमः काट्याय च गह्वरेष्ठाय च","नमो हृदय्याय च निवेष्प्याय च","नमः पाग्ंसव्याय च रजस्याय च","नमः शुष्क्याय च हरित्याय च","नमो लोप्याय चोलप्याय च ॥"],"tel":["నమ ఇరిణ్యాయ చ ప్రపథ్యాయ చ","నమః కిశిలాయ చ క్షయణాయ చ","నమః కపర్దినే చ పులస్తయే చ","నమో గోష్ఠ్యాయ చ గృహ్యాయ చ","నమస్తల్ప్యాయ చ గేహ్యాయ చ","నమః కాట్యాయ చ గహ్వరేష్ఠాయ చ","నమో హృదయ్యాయ చ నివేష్ప్యాయ చ","నమః పాగ్ంసవ్యాయ చ రజస్యాయ చ","నమః శుష్క్యాయ చ హరిత్యాయ చ","నమో లోప్యాయ చోలప్యాయ చ ॥"],"m":"Salutations to the one in barren land and on wide roads; in rocky places and in habitable places; to the one with matted hair and the one in front; to the one in cowsheds and in houses; in beds and in mansions; in thorny bushes and in caves; in deep waters and in dew; in dust and in mist; in dry and in green things; in hard ground and in grassy places."},{"label":"9.2","dev":["नम ऊर्व्याय च सूर्म्याय च","नमः पर्ण्याय च पर्णशद्याय च","नमोऽपगुरमाणाय चाभिघ्नते च","नम आक्खिदते च प्रक्खिदते च","नमो वः किरिकेभ्यो देवानाग्ं हृदयेभ्यो","नमो विक्षीणकेभ्यो नमो विचिन्वत्केभ्यो","नम आनिर्हतेभ्यो नम आमीवत्केभ्यः ॥"],"tel":["నమ ఊర్వ్యాయ చ సూర్మ్యాయ చ","నమః పర్ణ్యాయ చ పర్ణశద్యాయ చ","నమోఽపగురమాణాయ చాభిఘ్నతే చ","నమ ఆక్ఖిదతే చ ప్రక్ఖిదతే చ","నమో వః కిరికేభ్యో దేవానాగ్ం హృదయేభ్యో","నమో విక్షీణకేభ్యో నమో విచిన్వత్కేభ్యో","నమ ఆనిర్హతేభ్యో నమ ఆమీవత్కేభ్యః ॥"],"m":"Salutations to the one on the earth and in the waves; in leaves and in fallen leaves; to the one who raises his weapon and the one who strikes; to the one who troubles a little and greatly. Salutations to you who give abundance, who are the hearts of the gods; to the indestructible ones, to those who discern, to those who give wealth, and to those who are beyond decay."}]},{"name":"Namakam · Anuvaka 10","theme":"Prayers for protection: do not harm our children, elders, cattle or heroes; lay down your weapons and come with your bow unstrung.","units":[{"label":"10.1","dev":["द्रापे अन्धसस्पते दरिद्रन्नीललोहित ।","एषां पुरुषाणामेषां पशूनां मा भेर्मारो मो एषां","किंचनाममत् ॥"],"tel":["ద్రాపే అన్ధసస్పతే దరిద్రన్నీలలోహిత ।","ఏషాం పురుషాణామేషాం పశూనాం మా భేర్మారో మో ఏషాం","కించనామమత్ ॥"],"m":"O Rudra, who drives sinners away, lord of food, possessor of nothing, blue and red — do not frighten or harm these people and these animals of ours. Let none of them fall sick."},{"label":"10.2","dev":["या ते रुद्र शिवा तनूः शिवा विश्वाह भेषजी ।","शिवा रुद्रस्य भेषजी तया नो मृड जीवसे ॥"],"tel":["యా తే రుద్ర శివా తనూః శివా విశ్వాహ భేషజీ ।","శివా రుద్రస్య భేషజీ తయా నో మృడ జీవసే ॥"],"m":"O Rudra, your auspicious form that is always healing, auspicious and the healer of disease — with that form, make us happy so that we may live."},{"label":"10.3","dev":["इमा रुद्राय तवसे कपर्दिने क्षयद्वीराय प्रभरामहे मतिम् ।","यथा नः शमसद्द्विपदे चतुष्पदे विश्वं पुष्टं ग्रामे","आस्मिन्ननातुरम् ॥"],"tel":["ఇమా రుద్రాయ తవసే కపర్దినే క్షయద్వీరాయ ప్రభరామహే మతిమ్ ।","యథా నః శమసద్ద్విపదే చతుష్పదే విశ్వం పుష్టం గ్రామే","ఆస్మిన్ననాతురమ్ ॥"],"m":"We offer our thoughts to this mighty Rudra with matted locks, destroyer of heroes, so that there may be well-being for our two-footed and four-footed ones, and everything in this village may be nourished and free from disease."},{"label":"10.4","dev":["मृडा नो रुद्रोत नो मयस्कृधि क्षयद्वीराय नमसा विधेम ते ।","यच्छं च योश्च मनुरायजे पिता तदश्याम तव रुद्र प्रणीतौ ॥"],"tel":["మృడా నో రుద్రోత నో మయస్కృధి క్షయద్వీరాయ నమసా విధేమ తే ।","యచ్ఛం చ యోశ్చ మనురాయజే పితా తదశ్యామ తవ రుద్ర ప్రణీతౌ ॥"],"m":"O Rudra, be gracious to us and bring us happiness. We worship you, destroyer of heroes, with salutations. Whatever wellness and freedom from sin our father Manu gained by worship, may we gain that under your guidance."},{"label":"10.5","dev":["मा नो महान्तमुत मा नो अर्भकं","मा न उक्षन्तमुत मा न उक्षितम् ।","मा नो वधीः पितरं मोत मातरं प्रिया मा","नस्तनुवो रुद्र रीरिषः ॥"],"tel":["మా నో మహాన్తముత మా నో అర్భకం","మా న ఉక్షన్తముత మా న ఉక్షితమ్ ।","మా నో వధీః పితరం మోత మాతరం ప్రియా మా","నస్తనువో రుద్ర రీరిషః ॥"],"m":"O Rudra, do not harm our elders or our children, our young men or the unborn in the womb, our father or our mother, nor our dear bodies."},{"label":"10.6","dev":["मा नस्तोके तनये मा न आयुषि मा नो गोषु","मा नो अश्वेषु रीरिषः ।","वीरान्मा नो रुद्र भामितोऽवधीर्हविष्मन्तो","नमसा विधेम ते ॥"],"tel":["మా నస్తోకే తనయే మా న ఆయుషి మా నో గోషు","మా నో అశ్వేషు రీరిషః ।","వీరాన్మా నో రుద్ర భామితోఽవధీర్హవిష్మన్తో","నమసా విధేమ తే ॥"],"m":"Do not harm our children or grandchildren, our lives, our cattle or our horses. O Rudra, do not in anger slay our heroes. We worship you with offerings and salutations."},{"label":"10.7","dev":["आरात्ते गोघ्न उत पूरुषघ्ने क्षयद्वीराय","सुम्नमस्मे ते अस्तु ।","रक्षा च नो अधि च देव ब्रूह्यथा च नः","शर्म यच्छ द्विबर्हाः ॥"],"tel":["ఆరాత్తే గోఘ్న ఉత పూరుషఘ్నే క్షయద్వీరాయ","సుమ్నమస్మే తే అస్తు ।","రక్షా చ నో అధి చ దేవ బ్రూహ్యథా చ నః","శర్మ యచ్ఛ ద్విబర్హాః ॥"],"m":"Your weapon that kills cattle and people, keep it far from us; may your favour be with us, destroyer of heroes. Protect us, O God, speak for us, and give us happiness, O lord of both worlds."},{"label":"10.8","dev":["स्तुहि श्रुतं गर्तसदं युवानं मृगं न भीममुपहत्नुमुग्रम् ।","मृडा जरित्रे रुद्र स्तवानो अन्यन्ते","अस्मन्निवपन्तु सेनाः ॥"],"tel":["స్తుహి శ్రుతం గర్తసదం యువానం మృగం న భీమముపహత్నుముగ్రమ్ ।","మృడా జరిత్రే రుద్ర స్తవానో అన్యన్తే","అస్మన్నివపన్తు సేనాః ॥"],"m":"Praise the famous Rudra, seated in the heart, ever-young, fierce like a lion, the destroyer. O Rudra, being praised, be gracious to the one who praises you; may your armies strike others, not us."},{"label":"10.9","dev":["परि णो रुद्रस्य हेतिर्वृणक्तु परि त्वेषस्य दुर्मतिरघायोः ।","अव स्थिरा मघवद्भ्यस्तनुष्व मीढ्वस्तोकाय","तनयाय मृडय ॥"],"tel":["పరి ణో రుద్రస్య హేతిర్వృణక్తు పరి త్వేషస్య దుర్మతిరఘాయోః ।","అవ స్థిరా మఘవద్భ్యస్తనుష్వ మీఢ్వస్తోకాయ","తనయాయ మృడయ ॥"],"m":"May Rudra's weapon pass us by, and may the wrath of the fierce one turn away from us. Unstring your strong bow for the sake of those who make offerings; O bountiful one, be gracious to our children and grandchildren."},{"label":"10.10","dev":["मीढुष्टम शिवतम शिवो नः सुमना भव ।","परमे वृक्ष आयुधं निधाय कृत्तिं वसान","आचर पिनाकं बिभ्रदागहि ॥"],"tel":["మీఢుష్టమ శివతమ శివో నః సుమనా భవ ।","పరమే వృక్ష ఆయుధం నిధాయ కృత్తిం వసాన","ఆచర పినాకం బిభ్రదాగహి ॥"],"m":"O most bountiful, most auspicious one, be auspicious and kindly towards us. Placing your weapon on the highest tree, wearing the hide, come to us carrying only your bow, Pinaka."},{"label":"10.11","dev":["विकिरिद विलोहित नमस्ते अस्तु भगवः ।","यास्ते सहस्रहेतयोऽन्यमस्मन्निवपन्तु ताः ॥"],"tel":["వికిరిద విలోహిత నమస్తే అస్తు భగవః ।","యాస్తే సహస్రహేతయోఽన్యమస్మన్నివపన్తు తాః ॥"],"m":"O remover of troubles, O red one, salutations to you, O Lord. May your thousand weapons strike others than us."},{"label":"10.12","dev":["सहस्राणि सहस्रधा बाहुवोस्तव हेतयः ।","तासामीशानो भगवः पराचीना मुखा कृधि ॥"],"tel":["సహస్రాణి సహస్రధా బాహువోస్తవ హేతయః ।","తాసామీశానో భగవః పరాచీనా ముఖా కృధి ॥"],"m":"Thousands upon thousands of weapons are in your arms. O Lord, you who are their master, turn their points away from us."}]},{"name":"Namakam · Anuvaka 11","theme":"Salutations to the countless Rudras on earth, in the sky and heaven, followed by the concluding mantras including the Mahamrityunjaya.","units":[{"label":"11.1","dev":["सहस्राणि सहस्रशो ये रुद्रा अधि भूम्याम् ।","तेषाग्ं सहस्रयोजनेऽवधन्वानि तन्मसि ॥"],"tel":["సహస్రాణి సహస్రశో యే రుద్రా అధి భూమ్యామ్ ।","తేషాగ్ం సహస్రయోజనేఽవధన్వాని తన్మసి ॥"],"m":"The thousands of Rudras who are upon the earth — we unstring their bows a thousand yojanas away."},{"label":"11.2","dev":["अस्मिन् महत्यर्णवेऽन्तरिक्षे भवा अधि ॥"],"tel":["అస్మిన్ మహత్యర్ణవేఽన్తరిక్షే భవా అధి ॥"],"m":"The Rudras who dwell in this great ocean of the mid-air."},{"label":"11.3","dev":["नीलग्रीवाः शितिकण्ठाः शर्वा अधः क्षमाचराः ॥"],"tel":["నీలగ్రీవాః శితికణ్ఠాః శర్వా అధః క్షమాచరాః ॥"],"m":"The blue-necked, white-throated Sharvas who move below on the earth."},{"label":"11.4","dev":["नीलग्रीवाः शितिकण्ठा दिवरुद्रा उपश्रिताः ॥"],"tel":["నీలగ్రీవాః శితికణ్ఠా దివరుద్రా ఉపశ్రితాః ॥"],"m":"The blue-necked, white-throated Rudras who dwell in heaven."},{"label":"11.5","dev":["ये वृक्षेषु सस्पिंअरा नीलग्रीवा विलोहिताः ॥"],"tel":["యే వృక్షేషు సస్పింఅరా నీలగ్రీవా విలోహితాః ॥"],"m":"Those in the trees, green as young grass, blue-necked and red."},{"label":"11.6","dev":["ये भूतानामधिपतयो विशिखासः कपर्दिनः ॥"],"tel":["యే భూతానామధిపతయో విశిఖాసః కపర్దినః ॥"],"m":"Those who are lords of beings, without tufts of hair or with matted locks."},{"label":"11.7","dev":["ये अन्नेषु विविध्यन्ति पात्रेषु पिबतो जनान् ॥"],"tel":["యే అన్నేషు వివిధ్యన్తి పాత్రేషు పిబతో జనాన్ ॥"],"m":"Those who strike people in their food and those who drink from vessels."},{"label":"11.8","dev":["ये पथां पथिरक्षय ऐलबृदा यव्युधः ॥"],"tel":["యే పథాం పథిరక్షయ ఐలబృదా యవ్యుధః ॥"],"m":"Those who guard the paths, who bring food, who fight battles."},{"label":"11.9","dev":["ये तीर्थानि प्रचरन्ति सृकावन्तो निषङ्गिणः ॥"],"tel":["యే తీర్థాని ప్రచరన్తి సృకావన్తో నిషఙ్గిణః ॥"],"m":"Those who roam holy places with spears and swords."},{"label":"11.10","dev":["य एतावन्तश्च भूयासश्च दिशो रुद्रा वितस्थिरे","तेषाग्ं सहस्रयोजने । अवधन्वानि तन्मसि ॥"],"tel":["య ఏతావన్తశ్చ భూయాసశ్చ దిశో రుద్రా వితస్థిరే","తేషాగ్ం సహస్రయోజనే । అవధన్వాని తన్మసి ॥"],"m":"These and the many more Rudras spread in all directions — we unstring their bows a thousand yojanas away."},{"label":"11.11","dev":["नमो रुद्रेभ्यो ये पृथिव्यां ये । अन्तरिक्षे","ये दिवि येषामन्नं वातो वर्षमिषवस्तेभ्यो दश","प्राचीर्दश दक्षिणा दश प्रतीचीर्दशोदीचीर्दशोर्ध्वास्तेभ्यो","नमस्ते नो मृडयन्तु ते यं द्विष्मो यश्च नो द्वेष्टि","तं वो जम्भे दधामि ॥"],"tel":["నమో రుద్రేభ్యో యే పృథివ్యాం యే । అన్తరిక్షే","యే దివి యేషామన్నం వాతో వర్షమిషవస్తేభ్యో దశ","ప్రాచీర్దశ దక్షిణా దశ ప్రతీచీర్దశోదీచీర్దశోర్ధ్వాస్తేభ్యో","నమస్తే నో మృడయన్తు తే యం ద్విష్మో యశ్చ నో ద్వేష్టి","తం వో జమ్భే దధామి ॥"],"m":"Salutations to the Rudras on the earth, in the mid-air and in heaven, whose arrows are food, wind and rain. To them I offer ten fingers facing east, ten south, ten west, ten north, ten upward — salutations to them. May they make us happy. The one we hate and who hates us, I place in your jaws."},{"label":"Closing 1","dev":["त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् ।","उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय माऽमृतात् ॥"],"tel":["త్ర్యమ్బకం యజామహే సుగన్ధిం పుష్టివర్ధనమ్ ।","ఉర్వారుకమివ బన్ధనాన్మృత్యోర్ముక్షీయ మాఽమృతాత్ ॥"],"m":"We worship the three-eyed one, fragrant, who increases nourishment. Like a ripe cucumber released from its stem, may I be freed from death, not from immortality. (Mahamrityunjaya mantra)"},{"label":"Closing 2","dev":["यो रुद्रो अग्नौ यो अप्सु य ओषधीषु ।","यो रुद्रो विश्वा भुवनाऽऽविवेश","तस्मै रुद्राय नमो अस्तु ॥"],"tel":["యో రుద్రో అగ్నౌ యో అప్సు య ఓషధీషు ।","యో రుద్రో విశ్వా భువనాఽఽవివేశ","తస్మై రుద్రాయ నమో అస్తు ॥"],"m":"Salutations to that Rudra who is in fire, in water, in plants, and who has entered all the worlds."},{"label":"Closing 3","dev":["तमुष्टुहि यः स्विषुः सुधन्वा यो विश्वस्य क्षयति भेषजस्य ।","यक्ष्वामहे सौमनसाय रुद्रं नमोभिर्देवमसुरं दुवस्य ॥"],"tel":["తముష్టుహి యః స్విషుః సుధన్వా యో విశ్వస్య క్షయతి భేషజస్య ।","యక్ష్వామహే సౌమనసాయ రుద్రం నమోభిర్దేవమసురం దువస్య ॥"],"m":"Praise him with the good arrows and fine bow, who rules over all healing. We worship Rudra for a good mind; with salutations, worship the god who is the life-giver."},{"label":"Closing 4","dev":["अयं मे हस्तो भगवानयं मे भगवत्तरः ।","अयं मे विश्वभेषजोऽयग्ं शिवाभिमर्शनः ॥"],"tel":["అయం మే హస్తో భగవానయం మే భగవత్తరః ।","అయం మే విశ్వభేషజోఽయగ్ం శివాభిమర్శనః ॥"],"m":"This hand of mine is blessed; this one is more blessed still. This hand is the healer of all; its touch is auspicious."},{"label":"Closing 5","dev":["ये ते सहस्रमयुतं पाशा मृत्यो मर्त्याय हन्तवे ।","तान् यज्ञस्य मायया सर्वानव यजामहे ।","मृत्यवे स्वाहा मृत्यवे स्वाहा ॥"],"tel":["యే తే సహస్రమయుతం పాశా మృత్యో మర్త్యాయ హన్తవే ।","తాన్ యజ్ఞస్య మాయయా సర్వానవ యజామహే ।","మృత్యవే స్వాహా మృత్యవే స్వాహా ॥"],"m":"The thousand and ten thousand nooses of death set for mortals — we remove them all by the power of this sacrifice. Offerings to death, offerings to death."},{"label":"Closing 6","dev":["ॐ नमो भगवते रुद्राय विष्णवे मृत्युर्मे पाहि ।","प्राणानां ग्रन्थिरसि रुद्रो मा विशान्तकः ।","तेनान्नेनाप्यायस्व ॥"],"tel":["ఓం నమో భగవతే రుద్రాయ విష్ణవే మృత్యుర్మే పాహి ।","ప్రాణానాం గ్రన్థిరసి రుద్రో మా విశాన్తకః ।","తేనాన్నేనాప్యాయస్వ ॥"],"m":"Salutations to the blessed Rudra who is Vishnu; protect me from death. You are the knot of the life-breaths; O Rudra, enter me, not death. Nourish me with this food."}]},{"name":"Chamakam","theme":"The 'cha me' prayer: eleven anuvakas asking for every good thing in life, and that all of it be offered back in sacrifice.","units":[{"label":"Anuvaka 1","dev":["ॐ अग्नाविष्णू सजोषसेमा वर्धन्तु वां गिरः ।","द्युम्नैर्वाजेभिरागतम् ।","वाजश्च मे प्रसवश्च मे","प्रयतिश्च मे प्रसितिश्च मे","धीतिश्च मे क्रतुश्च मे","स्वरश्च मे श्लोकश्च मे","श्रावश्च मे श्रुतिश्च मे","ज्योतिश्च मे सुवश्च मे","प्राणश्च मेऽपानश्च मे","व्यानश्च मेऽसुश्च मे","चित्तं च म आधीतं च मे वाक्च मे","मनश्च मे चक्षुश्च मे","श्रोत्रं च मे दक्षश्च मे","बलं च म ओजश्च मे सहश्च म आयुश्च मे","जरा च म आत्मा च मे तनूश्च मे","शर्म च मे वर्म च मेऽङ्गानि च मेऽस्थानि च मे","परूग्ंषि च मे शरीराणि च मे ॥ १ ॥"],"tel":["ఓం అగ్నావిష్ణూ సజోషసేమా వర్ధన్తు వాం గిరః ।","ద్యుమ్నైర్వాజేభిరాగతమ్ ।","వాజశ్చ మే ప్రసవశ్చ మే","ప్రయతిశ్చ మే ప్రసితిశ్చ మే","ధీతిశ్చ మే క్రతుశ్చ మే","స్వరశ్చ మే శ్లోకశ్చ మే","శ్రావశ్చ మే శ్రుతిశ్చ మే","జ్యోతిశ్చ మే సువశ్చ మే","ప్రాణశ్చ మేఽపానశ్చ మే","వ్యానశ్చ మేఽసుశ్చ మే","చిత్తం చ మ ఆధీతం చ మే వాక్చ మే","మనశ్చ మే చక్షుశ్చ మే","శ్రోత్రం చ మే దక్షశ్చ మే","బలం చ మ ఓజశ్చ మే సహశ్చ మ ఆయుశ్చ మే","జరా చ మ ఆత్మా చ మే తనూశ్చ మే","శర్మ చ మే వర్మ చ మేఽఙ్గాని చ మేఽస్థాని చ మే","పరూగ్ంషి చ మే శరీరాణి చ మే ॥ ౧ ॥"],"m":"May Agni and Vishnu, pleased together, grow with these praises; come to us with splendour and strength. May I have food and the enjoyment of food, effort and focus, thought and right resolve, voice and fame, hearing and understanding, light and heaven, the breaths (prana, apana, vyana) and life, mind and knowledge, speech and thought, sight and hearing, skill and strength, vigour and endurance, long life and a healthy old age, the self and the body, shelter and armour, limbs and bones, joints and bodies."},{"label":"Anuvaka 2","dev":["ज्यैष्ठ्यं च म आधिपत्यं च मे मन्युश्च मे","भामश्च मेऽमश्च मेऽम्भश्च मे","जेमा च मे महिमा च मे","वरिमा च मे प्रथिमा च मे","वर्ष्मा च मे द्राघुया च मे","वृद्धं च मे वृद्धिश्च मे","सत्यं च मे श्रद्धा च मे","जगच्च मे धनं च मे","वशश्च मे त्विषिश्च मे","क्रीडा च मे मोदश्च मे","जातं च मे जनिष्यमाणं च मे","सूक्तं च मे सुकृतं च मे","वित्तं च मे वेद्यं च मे","भूतं च मे भविष्यच्च मे","सुगं च मे सुपथं च म ऋद्धं च म ऋद्धिश्च मे","कॢप्तं च मे कॢप्तिश्च मे","मतिश्च मे सुमतिश्च मे ॥ २ ॥"],"tel":["జ్యైష్ఠ్యం చ మ ఆధిపత్యం చ మే మన్యుశ్చ మే","భామశ్చ మేఽమశ్చ మేఽమ్భశ్చ మే","జేమా చ మే మహిమా చ మే","వరిమా చ మే ప్రథిమా చ మే","వర్ష్మా చ మే ద్రాఘుయా చ మే","వృద్ధం చ మే వృద్ధిశ్చ మే","సత్యం చ మే శ్రద్ధా చ మే","జగచ్చ మే ధనం చ మే","వశశ్చ మే త్విషిశ్చ మే","క్రీడా చ మే మోదశ్చ మే","జాతం చ మే జనిష్యమాణం చ మే","సూక్తం చ మే సుకృతం చ మే","విత్తం చ మే వేద్యం చ మే","భూతం చ మే భవిష్యచ్చ మే","సుగం చ మే సుపథం చ మ ఋద్ధం చ మ ఋద్ధిశ్చ మే","కౢప్తం చ మే కౢప్తిశ్చ మే","మతిశ్చ మే సుమతిశ్చ మే ॥ ౨ ॥"],"m":"May I have seniority and leadership, righteous anger and passion, steadiness, sweet water, victory and greatness, breadth and expanse, height and length, growth and increase, truth and faith, the world and wealth, control and radiance, play and joy, what is born and what will be born, good words and good deeds, wealth gained and to be gained, the past and the future, easy passage and good paths, prosperity and its growth, what is fitting and fitness, understanding and good judgement."},{"label":"Anuvaka 3","dev":["शं च मे मयश्च मे","प्रियं च मेऽनुकामश्च मे","कामश्च मे सौमनसश्च मे","भद्रं च मे श्रेयश्च मे","वस्यश्च मे यशश्च मे","भगश्च मे द्रविणं च मे","यन्ता च मे धर्ता च मे","क्षेमश्च मे धृतिश्च मे","विश्वं च मे महश्च मे","संविच्च मे ज्ञात्रं च मे","सूश्च मे प्रसूश्च मे","सीरं च मे लयश्च म ऋतं च मेऽमृतं च मेऽयक्ष्मं च मेऽनामयच्च मे","जीवातुश्च मे दीर्घायुत्वं च मेऽनमित्रं च मेऽभयं च मे","सुगं च मे शयनं च मे","सूषा च मे सुदिनं च मे ॥ ३ ॥"],"tel":["శం చ మే మయశ్చ మే","ప్రియం చ మేఽనుకామశ్చ మే","కామశ్చ మే సౌమనసశ్చ మే","భద్రం చ మే శ్రేయశ్చ మే","వస్యశ్చ మే యశశ్చ మే","భగశ్చ మే ద్రవిణం చ మే","యన్తా చ మే ధర్తా చ మే","క్షేమశ్చ మే ధృతిశ్చ మే","విశ్వం చ మే మహశ్చ మే","సంవిచ్చ మే జ్ఞాత్రం చ మే","సూశ్చ మే ప్రసూశ్చ మే","సీరం చ మే లయశ్చ మ ఋతం చ మేఽమృతం చ మేఽయక్ష్మం చ మేఽనామయచ్చ మే","జీవాతుశ్చ మే దీర్ఘాయుత్వం చ మేఽనమిత్రం చ మేఽభయం చ మే","సుగం చ మే శయనం చ మే","సూషా చ మే సుదినం చ మే ॥ ౩ ॥"],"m":"May I have happiness here and hereafter, what is dear and what I long for, desires and a good mind, the good and the better, a home and fame, fortune and wealth, a guide and a supporter, safety and courage, the world and greatness, knowledge and understanding, children and their begetting, ploughing and harvest, truth and immortality, freedom from disease and from illness, the means to live and long life, freedom from enemies and from fear, ease and good sleep, good dawns and good days."},{"label":"Anuvaka 4","dev":["ऊर्क्च मे सूनृता च मे","पयश्च मे रसश्च मे","घृतं च मे मधु च मे","सग्धिश्च मे सपीतिश्च मे","कृषिश्च मे वृष्टिश्च मे","जैत्रं च म औद्भिद्यं च मे रयिश्च मे","रायश्च मे पुष्टं च मे","पुष्टिश्च मे विभु च मे","प्रभु च मे बहु च मे","भूयश्च मे पूर्णं च मे","पूर्णतरं च मेऽक्षितिश्च मे","कूयवाश्च मेऽन्नं च मेऽक्षुच्च मे","व्रीहयश्च मे यवाश्च मे","माषाश्च मे तिलाश्च मे","मुद्गाश्च मे खल्वाश्च मे","गोधूमाश्च मे मसुराश्च मे","प्रियङ्गवश्च मेऽणवश्च मे","श्यामकाश्च मे नीवाराश्च मे ॥ ४ ॥"],"tel":["ఊర్క్చ మే సూనృతా చ మే","పయశ్చ మే రసశ్చ మే","ఘృతం చ మే మధు చ మే","సగ్ధిశ్చ మే సపీతిశ్చ మే","కృషిశ్చ మే వృష్టిశ్చ మే","జైత్రం చ మ ఔద్భిద్యం చ మే రయిశ్చ మే","రాయశ్చ మే పుష్టం చ మే","పుష్టిశ్చ మే విభు చ మే","ప్రభు చ మే బహు చ మే","భూయశ్చ మే పూర్ణం చ మే","పూర్ణతరం చ మేఽక్షితిశ్చ మే","కూయవాశ్చ మేఽన్నం చ మేఽక్షుచ్చ మే","వ్రీహయశ్చ మే యవాశ్చ మే","మాషాశ్చ మే తిలాశ్చ మే","ముద్గాశ్చ మే ఖల్వాశ్చ మే","గోధూమాశ్చ మే మసురాశ్చ మే","ప్రియఙ్గవశ్చ మేఽణవశ్చ మే","శ్యామకాశ్చ మే నీవారాశ్చ మే ॥ ౪ ॥"],"m":"May I have food and pleasant words, milk and its essence, ghee and honey, eating and drinking together, farming and rain, victory and abundant plants, riches and many riches, nourishment and its fullness, plenty and more, the full and the overflowing, the inexhaustible, coarse grain and food, unrotten grain, rice and barley, black gram and sesame, green gram and chickpeas, wheat and lentils, millet and fine grains, black rice and wild rice."},{"label":"Anuvaka 5","dev":["अश्मा च मे मृत्तिका च मे","गिरयश्च मे पर्वताश्च मे","सिकताश्च मे वनस्पतयश्च मे","हिरण्यं च मेऽयश्च मे","सीसं च मे त्रपुश्च मे","श्यामं च मे लोहं च मेऽग्निश्च म आपश्च मे","वीरुधश्च म ओषधयश्च मे कृष्टपच्यं च मेऽकृष्टपच्यं च मे","ग्राम्याश्च मे पशव आरण्याश्च यज्ञेन कल्पन्तां वित्तं च मे","वित्तिश्च मे भूतं च मे","भूतिश्च मे वसु च मे","वसतिश्च मे कर्म च मे","शक्तिश्च मेऽर्थश्च म एमश्च म इतिश्च मे","गतिश्च मे ॥ ५ ॥"],"tel":["అశ్మా చ మే మృత్తికా చ మే","గిరయశ్చ మే పర్వతాశ్చ మే","సికతాశ్చ మే వనస్పతయశ్చ మే","హిరణ్యం చ మేఽయశ్చ మే","సీసం చ మే త్రపుశ్చ మే","శ్యామం చ మే లోహం చ మేఽగ్నిశ్చ మ ఆపశ్చ మే","వీరుధశ్చ మ ఓషధయశ్చ మే కృష్టపచ్యం చ మేఽకృష్టపచ్యం చ మే","గ్రామ్యాశ్చ మే పశవ ఆరణ్యాశ్చ యజ్ఞేన కల్పన్తాం విత్తం చ మే","విత్తిశ్చ మే భూతం చ మే","భూతిశ్చ మే వసు చ మే","వసతిశ్చ మే కర్మ చ మే","శక్తిశ్చ మేఽర్థశ్చ మ ఏమశ్చ మ ఇతిశ్చ మే","గతిశ్చ మే ॥ ౫ ॥"],"m":"May I have stone and clay, hills and mountains, sand and trees, gold and iron, lead and tin, copper and bronze, fire and water, creepers and herbs, cultivated and wild plants, domestic and wild animals — may these become fit for the sacrifice — wealth and its gaining, prosperity and its growth, possessions and a dwelling, work and the ability to do it, purpose and its means, movement and progress."},{"label":"Anuvaka 6","dev":["अग्निश्च म इन्द्रश्च मे सोमश्च म इन्द्रश्च मे","सविता च म इन्द्रश्च मे सरस्वती च म इन्द्रश्च मे","पूषा च म इन्द्रश्च मे बृहस्पतिश्च म इन्द्रश्च मे","मित्रश्च म इन्द्रश्च मे वरुणश्च म इन्द्रश्च मे","त्वष्टा च म इन्द्रश्च मे धाता च म इन्द्रश्च मे","विष्णुश्च म इन्द्रश्च मेऽश्विनौ च म इन्द्रश्च मे","मरुतश्च म इन्द्रश्च मे विश्वे च मे","देवा इन्द्रश्च मे पृथिवी च म इन्द्रश्च मेऽन्तरिक्षं च म इन्द्रश्च मे","द्यौश्च म इन्द्रश्च मे दिशश्च म इन्द्रश्च मे","मूर्धा च म इन्द्रश्च मे प्रजापतिश्च म इन्द्रश्च मे ॥ ६ ॥"],"tel":["అగ్నిశ్చ మ ఇన్ద్రశ్చ మే సోమశ్చ మ ఇన్ద్రశ్చ మే","సవితా చ మ ఇన్ద్రశ్చ మే సరస్వతీ చ మ ఇన్ద్రశ్చ మే","పూషా చ మ ఇన్ద్రశ్చ మే బృహస్పతిశ్చ మ ఇన్ద్రశ్చ మే","మిత్రశ్చ మ ఇన్ద్రశ్చ మే వరుణశ్చ మ ఇన్ద్రశ్చ మే","త్వష్టా చ మ ఇన్ద్రశ్చ మే ధాతా చ మ ఇన్ద్రశ్చ మే","విష్ణుశ్చ మ ఇన్ద్రశ్చ మేఽశ్వినౌ చ మ ఇన్ద్రశ్చ మే","మరుతశ్చ మ ఇన్ద్రశ్చ మే విశ్వే చ మే","దేవా ఇన్ద్రశ్చ మే పృథివీ చ మ ఇన్ద్రశ్చ మేఽన్తరిక్షం చ మ ఇన్ద్రశ్చ మే","ద్యౌశ్చ మ ఇన్ద్రశ్చ మే దిశశ్చ మ ఇన్ద్రశ్చ మే","మూర్ధా చ మ ఇన్ద్రశ్చ మే ప్రజాపతిశ్చ మ ఇన్ద్రశ్చ మే ॥ ౬ ॥"],"m":"May I have Agni and Indra, Soma and Indra, Savita and Indra, Sarasvati and Indra, Pusha and Indra, Brihaspati and Indra, Mitra and Indra, Varuna and Indra, Tvashta and Indra, Dhata and Indra, Vishnu and Indra, the Ashvins and Indra, the Maruts and Indra, the Vishvedevas and Indra, Earth and Indra, the mid-air and Indra, heaven and Indra, the directions and Indra, the zenith and Indra, Prajapati and Indra — each god together with Indra."},{"label":"Anuvaka 7","dev":["अग्ंशुश्च मे रश्मिश्च मेऽदाभ्यश्च मेऽधिपतिश्च म उपाग्ंशुश्च मेऽन्तर्यामश्च म ऐन्द्रवायवश्च मे","मैत्रावरुणश्च म आश्विनश्च मे प्रतिप्रस्थानश्च मे","शुक्रश्च मे मन्थी च म आग्रयणश्च मे","वैश्वदेवश्च मे ध्रुवश्च मे","वैश्वानरश्च म ऋतुग्रहाश्च मेऽतिग्राह्याश्च म ऐन्द्राग्नश्च मे","वैश्वदेवश्च मे मरुत्वतीयाश्च मे","माहेन्द्रश्च म आदित्यश्च मे सावित्रश्च मे","सारस्वतश्च मे पौष्णश्च मे","पात्नीवतश्च मे हारियोजनश्च मे ॥ ७ ॥"],"tel":["అగ్ంశుశ్చ మే రశ్మిశ్చ మేఽదాభ్యశ్చ మేఽధిపతిశ్చ మ ఉపాగ్ంశుశ్చ మేఽన్తర్యామశ్చ మ ఐన్ద్రవాయవశ్చ మే","మైత్రావరుణశ్చ మ ఆశ్వినశ్చ మే ప్రతిప్రస్థానశ్చ మే","శుక్రశ్చ మే మన్థీ చ మ ఆగ్రయణశ్చ మే","వైశ్వదేవశ్చ మే ధ్రువశ్చ మే","వైశ్వానరశ్చ మ ఋతుగ్రహాశ్చ మేఽతిగ్రాహ్యాశ్చ మ ఐన్ద్రాగ్నశ్చ మే","వైశ్వదేవశ్చ మే మరుత్వతీయాశ్చ మే","మాహేన్ద్రశ్చ మ ఆదిత్యశ్చ మే సావిత్రశ్చ మే","సారస్వతశ్చ మే పౌష్ణశ్చ మే","పాత్నీవతశ్చ మే హారియోజనశ్చ మే ॥ ౭ ॥"],"m":"May I have (the Soma cups and vessels of the sacrifice): Amshu, Rashmi, Adabhya, Adhipati, Upamshu, Antaryama, Aindravayava, Maitravaruna, Ashvina, Pratiprasthana, Shukra, Manthi, Agrayana, Vaishvadeva, Dhruva, Vaishvanara, the seasonal cups, the Atigrahyas, Aindragna, Vaishvadeva, Marutvatiya, Mahendra, Aditya, Savitra, Sarasvata, Paushna, Patnivata and Hariyojana."},{"label":"Anuvaka 8","dev":["इध्मश्च मे बर्हिश्च मे","वेदिश्च मे धिष्णियाश्च मे","स्रुचश्च मे चमसाश्च मे","ग्रावाणश्च मे स्वरवश्च म उपरवाश्च मेऽधिषवणे च मे","द्रोणकलशश्च मे वायव्यानि च मे","पूतभृच्च म आधवनीयश्च म आग्नीध्रं च मे हविर्धानं च मे","गृहाश्च मे सदश्च मे","पुरोडाशाश्च मे पचताश्च मेऽवभृथश्च मे","स्वगाकारश्च मे ॥ ८ ॥"],"tel":["ఇధ్మశ్చ మే బర్హిశ్చ మే","వేదిశ్చ మే ధిష్ణియాశ్చ మే","స్రుచశ్చ మే చమసాశ్చ మే","గ్రావాణశ్చ మే స్వరవశ్చ మ ఉపరవాశ్చ మేఽధిషవణే చ మే","ద్రోణకలశశ్చ మే వాయవ్యాని చ మే","పూతభృచ్చ మ ఆధవనీయశ్చ మ ఆగ్నీధ్రం చ మే హవిర్ధానం చ మే","గృహాశ్చ మే సదశ్చ మే","పురోడాశాశ్చ మే పచతాశ్చ మేఽవభృథశ్చ మే","స్వగాకారశ్చ మే ॥ ౮ ॥"],"m":"May I have the sacred fuel and kusha grass, the altar and its hearths, the ladles and cups, the pressing stones, the sacrificial posts and their sockets, the pressing boards, the wooden vessel, the vessels for Vayu, the purifying vessel and the mixing vessel, the fire-shed and the shed for offerings, the houses and the assembly hall, the sacrificial cakes and cooked offerings, the final bath and the concluding offering."},{"label":"Anuvaka 9","dev":["अग्निश्च मे घर्मश्च मेऽर्कश्च मे","सूर्यश्च मे प्राणश्च मेऽश्वमेधश्च मे","पृथिवी च मेऽदितिश्च मे","दितिश्च मे द्यौश्च मे","शक्क्वरीरङ्गुलयो दिशश्च मे यज्ञेन कल्पन्तामृक्च मे","साम च मे स्तोमश्च मे","यजुश्च मे दीक्षा च मे","तपश्च म ऋतुश्च मे व्रतं च मेऽहोरात्रयोर्वृष्ट्या बृहद्रथन्तरे च मे","यज्ञेन कल्पेताम् ॥ ९ ॥"],"tel":["అగ్నిశ్చ మే ఘర్మశ్చ మేఽర్కశ్చ మే","సూర్యశ్చ మే ప్రాణశ్చ మేఽశ్వమేధశ్చ మే","పృథివీ చ మేఽదితిశ్చ మే","దితిశ్చ మే ద్యౌశ్చ మే","శక్క్వరీరఙ్గులయో దిశశ్చ మే యజ్ఞేన కల్పన్తామృక్చ మే","సామ చ మే స్తోమశ్చ మే","యజుశ్చ మే దీక్షా చ మే","తపశ్చ మ ఋతుశ్చ మే వ్రతం చ మేఽహోరాత్రయోర్వృష్ట్యా బృహద్రథన్తరే చ మే","యజ్ఞేన కల్పేతామ్ ॥ ౯ ॥"],"m":"May I have the fire and the heated offering, the sacred light and the Sun, the breath and the Ashvamedha, Earth and Aditi, Diti and heaven, the Shakvari verses, the fingers and the directions — may they be fit for the sacrifice — the Rig and the Sama, praise hymns and the Yajus, consecration and austerity, the seasons and vows; may day and night, rain, and the Brihat and Rathantara chants be fit for the sacrifice."},{"label":"Anuvaka 10","dev":["गर्भाश्च मे वत्साश्च मे","त्र्यविश्च मे त्र्यवी च मे","दित्यवाट् च मे दित्यौही च मे","पञ्चाविश्च मे पञ्चावी च मे","त्रिवत्सश्च मे त्रिवत्सा च मे","तुर्यवाट् च मे तुर्यौही च मे","पष्ठवाट् च मे पष्ठौही च म उक्षा च मे","वशा च म ऋषभश्च मे वेहच्च मेऽनड्वाञ्च मे","धेनुश्च म आयुर्यज्ञेन कल्पतां प्राणो यज्ञेन कल्पतामपानो यज्ञेन कल्पतां व्यानो यज्ञेन कल्पतां चक्षुर्यज्ञेन कल्पताग्ं श्रोत्रं यज्ञेन कल्पतां मनो यज्ञेन कल्पतां वाग्यज्ञेन कल्पतामात्मा यज्ञेन कल्पतां यज्ञो यज्ञेन कल्पताम् ॥ १० ॥"],"tel":[ ాజశ్చ ప్రసవశ్చాపిజశ్చ క్రతుశ్చ సువశ్చ మూర్ధా చ వ్యశ్నియశ్చాన్త్యాయనశ్చాన్త్యశ్చ భౌవనశ్చ భువనశ్చాధిపతిశ్చ ॥ ౧౧ ॥"],"m":"May I have the odd numbers from one, three, five, up to thirty-three, and the multiples of four from four, eight, twelve, up to forty-eight. (Then:) May food, its production, its continuance, will, heaven, the head, the vast, the final, the one in the world, the world itself and the supreme lord be mine."},{"label":"Closing","dev":["ॐ इडा देवहूर्मनुर्यज्ञनीर्बृहस्पतिरुक्थामदानि","शग्ंसिषद्विश्वेदेवाः सूक्तवाचः पृथिवीमातर्मा मा","हिग्ंसीर्मधु मनिष्ये मधु जनिष्ये मधु वक्ष्यामि","मधु वदिष्यामि मधुमतीं देवेभ्यो वाचमुद्यासग्ं","शुश्रूषेण्यां मनुष्येभ्यस्तं मा देवा अवन्तु शोभायै","पितरोऽनुमदन्तु ॥"],"tel":["ఓం ఇడా దేవహూర్మనుర్యజ్ఞనీర్బృహస్పతిరుక్థామదాని","శగ్ంసిషద్విశ్వేదేవాః సూక్తవాచః పృథివీమాతర్మా మా","హిగ్ంసీర్మధు మనిష్యే మధు జనిష్యే మధు వక్ష్యామి","మధు వదిష్యామి మధుమతీం దేవేభ్యో వాచముద్యాసగ్ం","శుశ్రూషేణ్యాం మనుష్యేభ్యస్తం మా దేవా అవన్తు శోభాయై","పితరోఽనుమదన్తు ॥"],"m":"May Ida, who invokes the gods, who guides Manu's sacrifice, and Brihaspati recite the hymns and give joy. O Vishvedevas who speak the hymns, O Mother Earth, do not harm me. May I think sweetly, be born sweetly, speak sweetly and act sweetly. May I speak sweet words to the gods and words worth hearing to people. May the gods protect me for splendour, and may the ancestors rejoice."}]}]},{"id":"guru","name":"Guru Ashtakam","dev":"गुर्वष्टकम्","tel":"గుర్వష్టకమ్","by":"Adi Shankaracharya","intro":"Composed by Adi Shankaracharya. Each verse lists something people chase — beauty, family, learning, fame, power, even detachment — and ends with the same refrain: if the mind is not fixed on the Guru's lotus feet, what then? It is a meditation on what actually matters.","refrain":"manashchenna lagnaM gurora~Nghripadme tataH kiM tataH kiM tataH kiM tataH kim — If the mind is not absorbed in the lotus feet of the Guru, then what (use is all this)? What then? What then? What then?","groups":[{"name े मे सदा षण्मुखोऽस्तु ॥ ६ ॥"],"tel":["గిరౌ మన్నివాసే నరా యేఽధిరూఢా-","స్తదా పర్వతే రాజతే తేఽధిరూఢాః ।","ఇతీవ బ్రువన్గన్ధశైలాధిరూఢః","స దేవో ముదే మే సదా షణ్ముఖోఽస్తు ॥ ౬ ॥"],"m":"'Those who climb this hill where I dwell are at once established on the king of mountains (Kailasa)' — as if saying this, he stands on the Gandhashaila hill. May that six-faced god always bring me joy.","g":[{"dev":"गिरौ मन्निवासे","tel":"గిరౌ మన్నివాసే","m":"on the hill where I dwell"},{"dev":"अधिरूढाः","tel":"అధిరూఢాః","m":"those who have climbed"},{"dev":"गन्धशैल","tel":"గన్ధశైల","m":"the fragrant hill"},{"dev":"षण्मुखः","tel":"షణ్ముఖః","m":"the six-faced one"}]},{"label":"Verse 7","dev":["महाम्भोधितीरे महापापचोरे","मुनीन्द्रानुकूले सुगन्धाख्यशैले ।","गुहायां वसन्तं स्वभासा लसन्तं","जनार्तिं हरन्तं श्रयामो गुहं तम् ॥ ७ ॥"],"tel":["మహామ్భోధితీరే మహాపాపచోరే","మునీన్ద్రానుకూలే సుగన్ధాఖ్యశైలే ।","గుహాయాం వసన్తం స్వభాసా లసన్తం","జనార్తిం హరన్తం శ్రయామో గుహం తమ్ ॥ ౭ ॥"],"m":"On the shore of the great ocean that steals away great sins, on the hill called Sugandha dear to great sages, he lives in a cave, shining with his own light, removing people's suffering. We take refuge in that Guha.","g":[{"dev":"महापापचोरे","tel":"మహాపాపచోరే","m":"thief of great sins"},{"dev":"मुनीन्द्रानुकूले","tel":"మునీన్ద్రానుకూలే","m":"favourable to great sages"},{"dev":"स्वभासा लसन्तं","tel":"స్వభాసా లసన్తం","m":"shining by his own light"},{"dev":"जनार्तिं हरन्तं","tel":"జనార్తిం హరన్తం","m":"removing people's pain"}]}]},{"name":"Form of the Lord · 8–19","units":[{"label":"Verse 8","dev":["लसत्स्वर्णगेहे नृणां कामदोहे","सुमस्तोमसञ्छन्नमाणिक्यमञ्चे ।","समुद्यत्सहस्रार्कतुल्यप्रकाशं","सदा भावये कार्तिकेयं सुरेशम् ॥ ८ ॥"],"tel":["లసత్స్వర్ణగేహే నృణాం కామదోహే","సుమస్తోమసఞ్ఛన్నమాణిక్యమఞ్చే ।","సముద్యత్సహస్రార్కతుల్యప్రకాశం","సదా భావయే కార్తికేయం సురేశమ్ ॥ ౮ ॥"],"m":"In a shining golden house that fulfils people's wishes, on a jewelled couch covered with heaps of flowers, he shines like a thousand rising suns. I always med ణ్డశిఖీన్ద్రవాహ","వల్లీశనాథ మమ దేహి కరావలమ్బమ్ ॥ ౪ ॥"],"m":"Destroyer of Krauncha and the chief of demons; whose divine hands are adorned with the spear, trident, bow and other weapons; who rides the king of peacocks — O Lord of Valli, give me the support of your hand.","g":[{"dev":"क्रौञ्चासुरेन्द्रपरिखण्डन","tel":"క్రౌఞ్చాసురేన్ద్రపరిఖణ్డన","m":"shatterer of Krauncha and the demon king"},{"dev":"शक्तिशूलचापादिशस्त्र","tel":"శక్తిశూలచాపాదిశస్త్ర","m":"spear, trident, bow and other weapons"},{"dev":"दिव्यपाणे","tel":"దివ్యపాణే","m":"O one with divine hands"},{"dev":"शिखीन्द्रवाह","tel":"శిఖీన్ద్రవాహ","m":"rider of the king of peacocks"}]},{"label":"Verse 5","dev":["देवाधिदेवरथमण्डलमध्यवेद्य","देवेन्द्रपीठनगरं दृढचापहस्तम् ।","शूरं निहत्य सुरकोटिभिरीड्यमान","वल्लीशनाथ मम देहि करावलम्बम् ॥ ५ ॥"],"tel":["దేవాధిదేవరథమణ్డలమధ్యవేద్య","దేవేన్ద్రపీఠనగరం దృఢచాపహస్తమ్ ।","శూరం నిహత్య సురకోటిభిరీడ్యమాన","వల్లీశనాథ మమ దేహి కరావలమ్బమ్ ॥ ౫ ॥"],"m":"Known in the middle of the chariot-circle of the god of gods, with the city of Indra's throne and a firm bow in hand; having slain Shura, praised by millions of gods — O Lord of Valli, give me the support of your hand.","g":[{"dev":"रथमण्डलमध्यवेद्य","tel":"రథమణ్డలమధ్యవేద్య","m":"known at the centre of the chariot"},{"dev":"देवेन्द्रपीठनगरं","tel":"దేవేన్ద్రపీఠనగరం","m":"Indra's throne-city"},{"dev":"दृढचापहस्तम्","tel":"దృఢచాపహస్తమ్","m":"with a firm bow in hand"},{"dev":"शूरं निहत्य","tel":"శూరం నిహత్య","m":"having slain Shura"},{"dev":"सुरकोटिभिः ईड्यमान","tel":"సురకోటిభిః ఈడ్యమాన","m":"praised by millions of gods"}]},{"label":"Verse 6","dev":["हारादिरत्नमणियुक्तकिरीटहार","केयूरकुण्डललसत्कवचाभिरामम् ।","हे वीर तारकजयामरवृन्दवन्द्य","वल्लीशनाथ मम देहि करावलम्बम् ॥ ६ ॥"],"tel":["హారాదిరత్నమణియుక్తకిరీటహార","కేయూరకుణ్డలలసత్కవచాభిరామమ్ ।","హే వీర తారకజయామరవృన్దవన్ద్య","వల్లీశనాథ మమ దేహి కరావలమ్బమ్ ॥ ౬ ॥"],"m":"Lovely with necklaces of gems and jewels, a crown, armlets, earrings and a shining armour; O hero, conqueror of Taraka, saluted by the hosts of gods — O Lord of Valli, give me the support of your hand.","g":[{"dev":"हारादिरत्नमणि","tel":"హారాదిరత్నమణి","m":"necklaces with gems and jewels"},{"dev":"किरीट","tel":"కిరీట","m":"crown"},{"dev":"केयूरकुण्डल","tel":"కేయూరకుణ్డల","m":"armlets and earrings"},{"dev":"कवच","tel":"కవచ","m":"armour"},{"dev":"हे वीर","tel":"హే వీర","m":"O hero"},{"dev":"तारकजय","tel":"తారకజయ","m":"conqueror of Taraka"}]},{"label":"Verse 7","dev":["पञ्चाक्षरादिमनुमन्त्रितगाङ्गतोयैः","पञ्चामृतैः प्रमुदितेन्द्रमुखैर्मुनीन्द्रैः ।","पट्टाभिषिक्तहरियुक्त परासनाथ","वल्लीशनाथ मम देहि करावलम्बम् ॥ ७ ॥"],"tel":["పఞ్చాక్షరాదిమనుమన్త్రితగాఙ్గతోయైః","పఞ్చామృతైః ప్రముదితేన్ద్రముఖైర్మునీన్ద్రైః ।","పట్టాభిషిక్తహరియుక్త పరాసనాథ","వల్లీశనాథ మమ దేహి కరావలమ్బమ్ ॥ ౭ ॥"],"m":"Crowned and anointed by Indra and the great sages with Ganga water sanctified by the five-syllable mantra and with the five nectars; O lord seated on the highest seat with Hari — O Lord of Valli, give me the support of your hand.","g":[{"dev":"पञ्चाक्षरादिमनुमन्त्रित","tel":"పఞ్చాక్షరాదిమనుమన్త్రిత","m":"sanctified with the five-syllable mantra and others"},{"dev":"गाङ्गतोयैः","tel":"గాఙ్గతోయైః","m":"with Ganga water"},{"dev":"पञ्चामृतैः","tel":"పఞ్చామృతైః","m":"with the five nectars"},{"dev":"पट्टाभिषिक्त","tel":"పట్టాభిషిక్త","m":"crowned, consecrated"},{"dev":"परासनाथ","tel":"పరాసనాథ","m":"lord of the supreme seat"}]},{"label":"Verse 8","dev":["श्रीकार्तिकेय करुणामृतपूर्णदृष्ट्या","कामादिरोगकलुषीकृतदुष्टचित्तम् ।","सिक्त्वा तु मामव कलाधरकान्तिकान्त्या","वल्लीशनाथ मम देहि करावलम्बम् ॥ ८ ॥"],"tel":["శ్రీకార్తికేయ కరుణామృతపూర్ణదృష్ట్యా","కామాదిరోగకలుషీకృతదుష్టచిత్తమ్ ।","సిక్త్వా తు మామవ కలాధరకాన్తికాన్త్యా","వల్లీశనాథ మమ దేహి కరావలమ్బమ్ ॥ ౮ ॥"],"m":"O Kartikeya, with your gaze full of the nectar of compassion, bathe and protect me, whose mind is stained by desire and other diseases — with a radiance lovely as the moon. O Lord of Valli, give me the support of your hand.","g":[{"dev":"करुणामृतपूर्णदृष्ट्या","tel":"కరుణామృతపూర్ణదృష్ట్యా","m":"with a glance full of the nectar of mercy"},{"dev":"कामादिरोग","tel":"కామాదిరోగ","m":"the disease of desire and the rest"},{"dev":"कलुषीकृत","tel":"కలుషీకృత","m":"made impure"},{"dev":"सिक्त्वा","tel":"సిక్త్వా","m":"having sprinkled, bathed"},{"dev":"माम् अव","tel":"మామ్ అవ","m":"protect me"},{"dev":"कलाधरकान्ति","tel":"కలాధరకాన్తి","m":"the lustre of the moon"}]},{"label":"Phalashruti","dev":["सुब्रह्मण्याष्टकं पुण्यं ये पठन्ति द्विजोत्तमाः ।","ते सर्वे मुक्तिमायान्ति सुब्रह्मण्यप्रसादतः ॥","सुब्रह्मण्याष्टकमिदं प्रातरुत्थाय यः पठेत् ।","कोटिजन्मकृतं पापं तत्क्षणादेव नश्यति ॥"],"tel":["సుబ్రహ్మణ్యాష్టకం పుణ్యం యే పఠన్తి ద్విజోత్తమాః ।","తే సర్వే ముక్తిమాయాన్తి సుబ్రహ్మణ్యప్రసాదతః ॥","సుబ్రహ్మణ్యాష్టకమిదం ప్రాతరుత్థాయ యః పఠేత్ ।","కోటిజన్మకృతం పాపం తత్క్షణాదేవ నశ్యతి ॥"],"m":"Phalashruti: Those who read this holy Subrahmanya Ashtakam all attain liberation by Subrahmanya's grace. Whoever reads it on rising in the morning — the sins of ten million births are destroyed in that very moment.","g":[{"dev":"पुण्यं","tel":"పుణ్యం","m":"holy"},{"dev":"मुक्तिम् आयान्ति","tel":"ముక్తిమ్ ఆయాన్తి","m":"attain liberation"},{"dev":"प्रसादतः","tel":"ప్రసాదతః","m":"by the grace"},{"dev":"प्रातरुत्थाय","tel":"ప్రాతరుత్థాయ","m":"rising at dawn"},{"dev":"कोटिजन्मकृतं पापं","tel":"కోటిజన్మకృతం పాపం","m":"sins of ten million births"},{"dev":"तत्क्षणादेव नश्यति","tel":"తత్క్షణాదేవ నశ్యతి","m":"perish that very instant"}]}]}]}]</script>
<script>
(function(){
const DATA=JSON.parse(document.getElementById('data').textContent);
const KEY='stotra-pathashala-v1';
let S={script:'dev',meaning:true,words:true,size:1.38,prog:{},last:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app'),nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function flat(st){const out=[];st.groups.forEach((g,gi)=>g.units.forEach((u,ui)=>out.push({g,gi,u,ui,i:out.length})));return out}
const FLAT={};DATA.forEach(s=>FLAT[s.id]=flat(s));
const byId=id=>DATA.find(s=>s.id===id);
const st=(sid,i)=>((S.prog[sid]||{})[i])||0; // 0 new,1 learning,2 memorised
function setSt(sid,i,v){S.prog[sid]=S.prog[sid]||{};if(v)S.prog[sid][i]=v;else delete S.prog[sid][i];save()}
function counts(sid){const n=FLAT[sid].length;let l=0,m=0;FLAT[sid].forEach(x=>{const v=st(sid,x.i);if(v===1)l++;if(v===2)m++});return{n,l,m}}
document.documentElement.style.setProperty('--chant',S.size+'rem');

function scriptSeg(){return `<div class="seg" role="group" aria-label="Script">
 <button type="button" data-script="dev" aria-pressed="${S.script==='dev'}"><span class="d">देव</span></button>
 <button type="button" data-script="tel" aria-pressed="${S.script==='tel'}"><span class="te">తెలుగు</span></button>
 <button type="button" data-script="both" aria-pressed="${S.script==='both'}">Both</button></div>`}
function titleIn(s){return S.script==='tel'?`<span style="font-family:var(--f-tel)">${s.tel}</span>`:`<span style="font-family:var(--f-dev)">${s.dev}</span>`}

/* ---------- Home ---------- */
function home(){
  nav.hidden=true;
  let resume='';
  if(S.last&&byId(S.last.sid)){const s=byId(S.last.sid),x=FLAT[s.id][S.last.i];if(x)resume=`<button class="resume" type="button" data-open="${s.id}" data-i="${x.i}"><div><b>Continue ${esc(s.name)}</b><span>${esc(x.g.name)} · ${esc(x.u.label)}</span></div><span class="go">Resume →</span></button>`}
  app.innerHTML=`<div class="bar"><div class="t"></div>${scriptSeg()}</div>
  <header class="masthead"><div class="tripundra" aria-hidden="true"><i></i><i></i><i></i></div>
   <h1>${S.script==='tel'?'<span style="font-family:var(--f-tel)">స్తోత్ర పాఠశాల</span>':'स्तोत्र पाठशाला'}</h1>
   <p>Six stotras, verse by verse, in Devanagari and Telugu with meanings. Mark each verse as you learn it and memorise it.</p>${resume}</header>
  <div class="list">${DATA.map(s=>{const c=counts(s.id),pct=c.n?c.m/c.n:0,r=22,C=2*Math.PI*r;
   const bars=s.groups.map(g=>{const xs=FLAT[s.id].filter(x=>x.g===g);const m=xs.filter(x=>st(s.id,x.i)===2).length,l=xs.filter(x=>st(s.id,x.i)===1).length;return `<i class="${m===xs.length?'m':(m||l)?'l':''}" title="${esc(g.name)}"></i>`}).join('');
   return `<button class="stotra" type="button" data-open="${s.id}">
    <div><div class="nm">${esc(s.name)}</div><div class="sc">${titleIn(s)}</div></div>
    <div class="ring" aria-label="${c.m} of ${c.n} memorised"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--rule)" stroke-width="5"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--done)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><span class="num">${c.m}/${c.n}</span></div>
    <div class="meta">${esc(s.by)} · ${c.n} ${s.id==='rudram'?'sections':'verses'}${c.l?` · ${c.l} learning`:''}</div>
    <div class="bars" aria-hidden="true">${bars}</div></button>`}).join('')}</div>
  <div class="foot"><span>Sanskrit text from <a href="https://sanskritdocuments.org" target="_blank" rel="noopener">sanskritdocuments.org</a>, with a few typographical corrections. Rudram is shown without svara marks; learn its chanting from a teacher or trusted recording.</span><span>Progress is saved in this browser on this device.</span></div>`;
  bind();
}

/* ---------- Stotra overview ---------- */
function overview(sid){
  nav.hidden=true;const s=byId(sid),c=counts(sid);
  let gi=0;
  app.innerHTML=`<div class="bar"><button class="back" type="button" data-home>← All</button><div class="t"></div>${scriptSeg()}</div>
  <header class="head"><div class="sc">${titleIn(s)}</div><h2>${esc(s.name)} · ${esc(s.by)}</h2>${s.note?`<p class="intro" style="margin:0;color:var(--muted)">${esc(s.note)}</p>`:''}<p class="intro">${esc(s.intro)}</p>
  ${s.refrain?`<div class="refrain"><span class="eyebrow">Refrain</span><br>${esc(s.refrain)}</div>`:''}
  <div class="stats"><span class="chip m"><span class="dot"></span>${c.m} memorised</span><span class="chip l"><span class="dot"></span>${c.l} learning</span><span class="chip"><span class="dot"></span>${c.n-c.m-c.l} new</span></div>
  <div class="startrow"><button class="btn" type="button" data-learn="${firstUnlearned(sid)}">${c.m+c.l?'Continue learning':'Start at the beginning'}</button>${c.l?`<button class="btn ghost" type="button" data-review>Review ${c.l} in progress</button>`:''}</div></header>
  ${s.groups.map(g=>{const xs=FLAT[sid].filter(x=>x.g===g);const m=xs.filter(x=>st(sid,x.i)===2).length;
   return `<section class="group"><h3><span>${esc(g.name)}</span><small>${m}/${xs.length}</small></h3>${g.theme?`<p class="theme">${esc(g.theme)}</p>`:''}
   <div class="units">${xs.map(x=>{const v=st(sid,x.i);const lab=x.u.label.replace(/^Verse /,'').replace(/^Anuvaka /,'').replace(/^Closing ?/,'C').replace('Phalashruti','Phala');return `<button type="button" class="u ${v===1?'l':v===2?'m':''}" data-learn="${x.i}" aria-label="${esc(x.u.label)}${v===2?', memorised':v===1?', learning':''}">${esc(lab||'C')}</button>`}).join('')}</div></section>`}).join('')}`;
  bind(sid);window.scrollTo(0,0);
}
function firstUnlearned(sid){const f=FLAT[sid].find(x=>st(sid,x.i)!==2);return f?f.i:0}

/* ---------- Verse reader ---------- */
let R={sid:null,i:0,hide:false,list:null};
function reader(sid,i,list){
  R={sid,i,hide:false,list:list||null};S.last={sid,i};save();drawReader();window.scrollTo(0,0);
}
function lines(u,which){return `<div class="blk ${which}">${u[which].map((l,k)=>`<div class="line ${which}${k===0?' first':''}" data-line>${esc(l)}</div>`).join('')}</div>`}
function drawReader(){
  const s=byId(R.sid),arr=FLAT[R.sid],x=arr[R.i],u=x.u,v=st(R.sid,R.i);
  const seq=R.list||arr.map(a=>a.i),pos=seq.indexOf(R.i);
  const chant=S.script==='both'?lines(u,'dev')+lines(u,'tel'):lines(u,S.script);
  const gl=u.g&&S.words?`<div class="gloss">${u.g.map(w=>`<div><span class="w ${S.script==='tel'?'tel':'dev'}">${esc(S.script==='tel'?w.tel:w.dev)}</span><span class="gm">${esc(w.m)}</span></div>`).join('')}</div>`:'';
  app.innerHTML=`<div class="bar"><button class="back" type="button" data-ov="${s.id}">← ${esc(s.name)}</button><div class="t"></div></div>
  <div class="settings">${scriptSeg()}<div class="size" role="group" aria-label="Text size"><button type="button" data-size="-1" aria-label="Smaller text">A−</button><button type="button" data-size="1" aria-label="Larger text">A+</button></div></div>
  <div class="reader">
   <div class="pos"><span class="g">${esc(x.g.name)}${R.list?' · Review':''}</span><span class="n">${esc(u.label)} · ${pos+1}/${seq.length}</span></div>
   <div class="progress"><i style="width:${(pos+1)/seq.length*100}%"></i></div>
   <article class="leaf"><div class="chant ${S.script==='both'?'both':''} ${R.hide?'hidden':''}" id="chant">${chant}</div>
   ${R.hide?'<p class="hint">Recite from memory. Tap a line to check it.</p>':''}</article>
   <div class="tools">
    <button class="tool" type="button" data-hide aria-pressed="${R.hide}">${R.hide?'Show text':'Test recall'}</button>
    <button class="tool" type="button" data-meaning aria-pressed="${S.meaning}">Meaning</button>
    ${u.g?`<button class="tool" type="button" data-words aria-pressed="${S.words}">Word meanings</button>`:''}
   </div>
   ${S.meaning?`<section class="meaning"><span class="eyebrow">Meaning</span><p>${esc(u.m)}</p>${gl}</section>`:(gl?`<section class="meaning">${gl}</section>`:'')}
   <div class="status"><button type="button" class="l" data-st="1" aria-pressed="${v===1}">${v===1?'✓ ':''}Learning</button><button type="button" class="m" data-st="2" aria-pressed="${v===2}">${v===2?'✓ ':''}Memorised</button></div>
  </div>`;
  nav.hidden=false;
  document.getElementById('prev').disabled=pos<=0;
  const nx=document.getElementById('next');nx.disabled=pos>=seq.length-1;nx.textContent=pos>=seq.length-1?'Last':'Next →';
  bind(R.sid);
}
function step(d){const seq=R.list||FLAT[R.sid].map(a=>a.i),p=seq.indexOf(R.i)+d;if(p<0||p>=seq.length)return;R.i=seq[p];R.hide=false;S.last={sid:R.sid,i:R.i};save();drawReader();window.scrollTo(0,0)}
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);

function rerender(){if(nav.hidden===false&&R.sid)drawReader();else if(cur.view==='ov')overview(cur.sid);else home()}
let cur={view:'home'};
function bind(sid){
  app.querySelectorAll('[data-script]').forEach(b=>b.onclick=()=>{S.script=b.dataset.script;save();rerender()});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const id=b.dataset.open;if(b.dataset.i!==undefined){cur={view:'ov',sid:id};reader(id,+b.dataset.i)}else{cur={view:'ov',sid:id};overview(id)}});
  app.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{cur={view:'home'};R.sid=null;home();window.scrollTo(0,0)});
  app.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{cur={view:'ov',sid:b.dataset.ov};R.sid=null;overview(b.dataset.ov)});
  app.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>reader(sid,+b.dataset.learn));
  app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const l=FLAT[sid].filter(x=>st(sid,x.i)===1).map(x=>x.i);if(l.length)reader(sid,l[0],l)});
  app.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{R.hide=!R.hide;drawReader()});
  app.querySelectorAll('[data-meaning]').forEach(b=>b.onclick=()=>{S.meaning=!S.meaning;save();drawReader()});
  app.querySelectorAll('[data-words]').forEach(b=>b.onclick=()=>{S.words=!S.words;save();drawReader()});
  app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{S.size=Math.min(2.2,Math.max(1,+(S.size+(+b.dataset.size)*0.12).toFixed(2)));document.documentElement.style.setProperty('--chant',S.size+'rem');save()});
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const v=+b.dataset.st;setSt(R.sid,R.i,st(R.sid,R.i)===v?0:v);drawReader()});
  app.querySelectorAll('.hidden [data-line]').forEach(l=>l.onclick=()=>l.classList.toggle('shown'));
}
window.addEventListener('scroll',()=>{const b=app.querySelector('.bar');if(b)b.classList.toggle('scrolled',window.scrollY>4)},{passive:true});
const h=(location.hash||'').slice(1);
if(h&&byId(h)){cur={view:'ov',sid:h};overview(h)}else home();
})();
</script>
